name: release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to publish, e.g. v1.2.3'
        required: true

env:
  REGISTRY: git.kwkaiser.io
  IMAGE: git.kwkaiser.io/kwkaiser/devbox

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Resolve version
        id: meta
        run: |
          set -euo pipefail
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            version="${{ github.event.inputs.version }}"
          else
            version="${{ github.ref_name }}"
          fi
          version="${version#v}"
          if [ -z "$version" ]; then
            echo "could not resolve a version" >&2
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "sha=$(git rev-parse --short HEAD)" >> "$GITHUB_OUTPUT"

      - name: Set up remote builder SSH access
        env:
          NIX_REMOTE_BUILDER_KEY: ${{ secrets.NIX_REMOTE_BUILDER_KEY }}
        run: |
          set -euo pipefail
          printf '%s\n' "$NIX_REMOTE_BUILDER_KEY" > /tmp/nix-remote-builder-key
          chmod 600 /tmp/nix-remote-builder-key
          ssh-keyscan -H kwkaiser.io | sudo tee -a /etc/ssh/ssh_known_hosts >/dev/null

      - uses: DeterminateSystems/nix-installer-action@main
        with:
          extra-conf: |
            builders = ssh://nixbuilder@kwkaiser.io x86_64-linux /tmp/nix-remote-builder-key 2 1 - - -
            builders-use-substitutes = true
            max-jobs = 0

      - name: Build devbox image
        run: nix build .#packages.x86_64-linux.devbox-image

      - name: Push image
        env:
          IMAGE: ${{ env.IMAGE }}
          VERSION: ${{ steps.meta.outputs.version }}
          SHA: ${{ steps.meta.outputs.sha }}
          REGISTRY_USER: ${{ github.actor }}
          REGISTRY_TOKEN: ${{ secrets.K8S_GITEA_REGISTRY_PACKAGE_TOKEN }}
        run: |
          set -eu
          : "${REGISTRY_TOKEN:?REGISTRY_TOKEN is not set}"
          for tag in "$VERSION" "$SHA" latest; do
            echo "pushing $IMAGE:$tag"
            nix run nixpkgs#skopeo -- --insecure-policy copy \
              --dest-creds "$REGISTRY_USER:$REGISTRY_TOKEN" \
              docker-archive:result \
              "docker://$IMAGE:$tag"
          done
