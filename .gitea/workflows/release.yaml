name: release

on:
  schedule:
    - cron: '0 0 * * 0'
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to publish, e.g. v1.2.3'
        required: true

env:
  REGISTRY: git.kwkaiser.io
  IMAGE: git.kwkaiser.io/kwkaiser/devbox
  FLY_APP: kwkaiser-devbox
  FLY_ORG: personal

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Resolve version
        id: meta
        run: |
          set -euo pipefail
          sha="$(git rev-parse --short HEAD)"
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            version="${{ github.event.inputs.version }}"
            version="${version#v}"
          else
            version="$sha"
          fi
          if [ -z "$version" ]; then
            echo "could not resolve a version" >&2
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "sha=$sha" >> "$GITHUB_OUTPUT"

      - name: Set up remote builder SSH access
        env:
          NIX_REMOTE_BUILDER_KEY: ${{ secrets.NIX_REMOTE_BUILDER_KEY }}
        run: |
          set -euo pipefail
          printf '%s\n' "$NIX_REMOTE_BUILDER_KEY" > /tmp/nix-remote-builder-key
          chmod 600 /tmp/nix-remote-builder-key
          ssh-keyscan -H kwkaiser.io | sudo tee -a /etc/ssh/ssh_known_hosts >/dev/null
          printf 'Host kwkaiser.io\n  User nixbuilder\n  IdentityFile /tmp/nix-remote-builder-key\n' | \
            sudo tee /etc/ssh/ssh_config.d/nix-remote-builder.conf >/dev/null

      - uses: DeterminateSystems/nix-installer-action@main
        with:
          extra-conf: |
            builders = ssh-ng://nixbuilder@kwkaiser.io x86_64-linux /tmp/nix-remote-builder-key 2 1 - - -
            builders-use-substitutes = true
            extra-substituters = ssh-ng://nixbuilder@kwkaiser.io?trusted=true
            max-jobs = 0

      - name: Build devbox image
        run: nix build .#packages.x86_64-linux.devbox-image

      - name: Push image
        env:
          IMAGE: ${{ env.IMAGE }}
          VERSION: ${{ steps.meta.outputs.version }}
          SHA: ${{ steps.meta.outputs.sha }}
          REGISTRY_USER: ${{ github.actor }}
          REGISTRY_TOKEN: ${{ secrets.K8S_GITEA_REGISTRY_PACKAGE_TOKEN }}
        run: |
          set -eu
          : "${REGISTRY_TOKEN:?REGISTRY_TOKEN is not set}"
          tags="$VERSION $SHA latest"
          for tag in $(printf '%s\n' $tags | sort -u); do
            echo "pushing $IMAGE:$tag"
            nix run nixpkgs#skopeo -- --insecure-policy copy \
              --dest-creds "$REGISTRY_USER:$REGISTRY_TOKEN" \
              docker-archive:result \
              "docker://$IMAGE:$tag"
          done

      - name: Push image to Fly.io
        env:
          FLY_APP: ${{ env.FLY_APP }}
          FLY_ORG: ${{ env.FLY_ORG }}
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
        run: |
          set -eu
          : "${FLY_API_TOKEN:?FLY_API_TOKEN is not set}"
          nix run nixpkgs#flyctl -- apps create "$FLY_APP" --org "$FLY_ORG" 2>/dev/null || true
          nix run nixpkgs#skopeo -- --insecure-policy copy \
            --dest-creds "x:$FLY_API_TOKEN" \
            docker-archive:result \
            "docker://registry.fly.io/$FLY_APP:latest"
