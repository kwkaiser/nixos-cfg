[project]
name     = "nixos-cfg"
revision = "1.0"

[profiles.default]
TF_VAR_linode_token = { required = true, description = "Linode API token (terraform provider auth)", providers = [
  "kdbx",
], ref = { item = "personal/projects/homelab/linode access token", field = "Password" } }

TF_VAR_hcloud_token = { required = true, description = "Hetzner Cloud API token (terraform provider auth)", providers = [
  "kdbx",
], ref = { item = "personal/services/tech/hetzner-api-key", field = "Password" } }

TF_VAR_authorized_keys = { default = '["ssh-rsa  (encrypted)"]', description = "SSH public key(s) authorized on the bootstrap image, as a terraform list literal (mine.primarySshKey from hosts/homelab/default.nix - TF_VAR_ list/object env vars are parsed as HCL)." }
